<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #000;
  --ink: #fff;
  --mute: #999;
  --line: rgba(255,255,255,.06);
}

#siteHeader {
  position: sticky;
  top: 0;
  z-index: 1000;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,.8);
  border-bottom: 1px solid var(--line);
  padding: 0;
  margin: 0;
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 24px;
}

.logo-link {
  text-decoration: none;
  color: var(--ink);
  font-size: 12px;
  letter-spacing: .15em;
  text-transform: uppercase;
  font-weight: 700;
  opacity: .8;
  transition: opacity .2s ease;
}

.logo-link:hover {
  opacity: 1;
}

.nav {
  display: flex;
  gap: 28px;
  align-items: center;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav a {
  text-decoration: none;
  color: var(--ink);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .65;
  transition: all .2s ease;
  position: relative;
  font-weight: 600;
}

.nav a:hover {
  opacity: 1;
}

.nav a.active {
  opacity: 1;
  color: #00e0c6;
}

.nav a.active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 100%;
  height: 1px;
  background: #00e0c6;
}

.header-right {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-left: auto;
}

.music-toggle {
  cursor: pointer;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink);
  opacity: .65;
  transition: opacity .2s ease;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
}

.music-toggle:hover {
  opacity: 1;
}

#cartLink {
  position: relative;
  cursor: pointer;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink);
  opacity: .65;
  transition: opacity .2s ease;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
}

#cartLink:hover {
  opacity: 1;
}

#cartCount {
  font-size: 9px;
  opacity: .5;
  margin-left: 4px;
}

@media (max-width: 768px) {
  .header-inner {
    flex-direction: column;
    gap: 12px;
    padding: 12px 16px;
  }

  .nav {
    gap: 16px;
    width: 100%;
    justify-content: center;
  }

  .header-right {
    width: 100%;
    justify-content: center;
  }
}
</style>
</head>
<body>

<header id="siteHeader" role="banner">
  <div class="header-inner">
    <a href="home.html" class="logo-link">SINS OF THE PAST™</a>

    <nav role="navigation">
      <ul class="nav">
        <li><a href="home.html" data-nav="home">Home</a></li>
        <li><a href="shop.html" data-nav="shop">Shop</a></li>
        <li><a href="about.html" data-nav="about">Lore</a></li>
        <li><a href="arcade.html" data-nav="arcade">Arcade</a></li>
        <li><a href="contact.html" data-nav="contact">Contact</a></li>
      </ul>
    </nav>

    <div class="header-right">
      <button id="cartLink" aria-label="Open shopping cart">
        Bag<span id="cartCount"></span>
      </button>
    </div>
  </div>
</header>

</body>
</html>
