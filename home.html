<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sins of the Past — Inside</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,sans-serif;
}

.hidden{display:none}

header{
  padding:24px;
  border-bottom:1px solid #222;
}

.vip{
  background:linear-gradient(90deg,#ff5a5a,#ffb347);
  color:#000;
  padding:12px 16px;
  border-radius:12px; 
  font-weight:800;
  margin-bottom:12px;
}

.locked{
  min-height:80vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}

.locked h1{
  font-size:22px;
  margin-bottom:12px;
}

main{
  padding:24px;
}

.sin{
  opacity:.7;
  font-size:12px;
  margin-top:6px;
}
</style>
</head>

<body>

<!-- LOCKED STATE -->
<section id="locked" class="locked hidden">
  <div>
    <h1>Access Denied</h1>
    <p>You skipped confession and failed judgment.</p>
    <p>Come back honest… or stronger.</p>
  </div>
</section>

<!-- MAIN CONTENT -->
<div id="content" class="hidden">

  <header>
    <div id="vipBanner" class="vip hidden">
      ☠️ You defeated the Grim Reaper — 15% off unlocked
    </div>
    <h1>Welcome inside</h1>
    <div class="sin" id="sinText"></div>
  </header>

  <main>
    <p>This is where your shop, drops, lookbooks, and rituals live.</p>

    <!-- Example product -->
    <div style="margin-top:24px;padding:16px;border:1px solid #222;border-radius:12px;">
      <h3>Sample Item</h3>
      <p>$100</p>
      <button>Buy Now</button>
    </div>
  </main>

</div>

<script>
const KEY = 'sop_user';

// ===== AUTO-FIX LOCALSTORAGE =====
let user;
try {
  const raw = localStorage.getItem(KEY);
  user = raw ? JSON.parse(raw) : {};
} catch {
  user = {};
}

// Ensure fields exist
user.lastSin = user.lastSin || '';
user.beatGrimReaper = user.beatGrimReaper || false;
user.discountCode = user.discountCode || '';
user.firstVisit = user.firstVisit ?? true;

// Save fixed data back
localStorage.setItem(KEY, JSON.stringify(user));

// ===== SHOW LOCKED OR CONTENT =====
const locked  = document.getElementById('locked');
const content = document.getElementById('content');
const vip     = document.getElementById('vipBanner');
const sinText = document.getElementById('sinText');

// No user or missing data? send to gate
if(!user || (!user.lastSin && !user.beatGrimReaper)){
  window.location.href='index.html';
}

// Locked state only if skipped AND Reaper not beaten
if(user.lastSin === 'skipped' && !user.beatGrimReaper){
  locked.classList.remove('hidden');
  content.classList.add('hidden');
} else {
  content.classList.remove('hidden');
  locked.classList.add('hidden');
}

// SIN TEXT
if(user.lastSin && user.lastSin !== 'skipped'){
  sinText.textContent = `Last sin confessed: ${user.lastSin}`;
} else if(user.beatGrimReaper){
  sinText.textContent = `You entered by force.`;
} else {
  sinText.textContent = '';
}

// VIP
if(user.beatGrimReaper && user.discountCode){
  vip.classList.remove('hidden');
  console.log('Apply discount:', user.discountCode);
}
</script>

</body>
</html>
