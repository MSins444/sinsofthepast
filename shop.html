<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sins of the Past — Selected Pieces</title>

<style>
:root{
  --bg:#0a0b0f;
  --ink:#f6f6f8;
  --mute:#9aa0b2;
  --line:#1b1f2e;
  --gold:#c8a75e;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui;
}

main{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:56px 22px;
}

.header{
  text-align:center;
  margin-bottom:52px;
}

.header h1{
  margin:0 0 14px;
  font-size:clamp(30px,6vw,58px);
  letter-spacing:.06em;
}

.header p{
  margin:0 auto;
  max-width:38ch;
  color:var(--mute);
  line-height:1.5;
}

.grid{
  max-width:960px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:28px;
}

.card{
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#0f1324;
}

.card img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  display:block;
}

.meta{
  padding:16px 18px;
}

.meta h3{
  margin:0;
  font-size:13px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.meta span{
  display:block;
  margin-top:6px;
  font-size:12px;
  color:var(--mute);
}

.footer{
  margin-top:64px;
  text-align:center;
  font-size:12px;
  color:var(--mute);
  letter-spacing:.06em;
}
</style>
</head>

<body>
<main>

  <div class="header">
    <h1>SINS OF THE PAST</h1>
    <p>
      The collection is not yet open.  
      These pieces mark the beginning.
    </p>
  </div>

  <section class="grid">
    <div class="card">
      <img src="assets/two-faced-mink-headband-hero.jpg" alt="">
      <div class="meta">
        <h3>Reversible Mink Headband</h3>
        <span>Preview only</span>
      </div>
    </div>

    <div class="card">
      <img src="assets/blu1.jpg" alt="">
      <div class="meta">
        <h3>Fox Tail Charm</h3>
        <span>Preview only</span>
      </div>
    </div>

    <div class="card">
      <img src="assets/dont-check-my-bank-account-wallet1.jpg" alt="">
      <div class="meta">
        <h3>Dont Check My Bank Account Wallet</h3>
        <span>Preview only</span>
      </div>
    </div>
  </section>

  <div class="footer">
    NO RESTOCKS · NO RUSH · COMING SOON
  </div>

</main>
</body>
</html>
