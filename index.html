<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Become a Sinner — Sins of the Past</title>
<link rel="preload" as="image" href="assets/SinsF.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Press Start 2P',monospace;display:flex;align-items:center;justify-content:center}

#grid{position:absolute;inset:0;background:
  linear-gradient(#111 1px,transparent 1px),
  linear-gradient(90deg,#111 1px,transparent 1px);
background-size:40px 40px;opacity:.35}

.container{z-index:2;width:min(460px,92vw);background:rgba(14,14,20,.95);border:2px solid #ff5a5a;border-radius:14px;padding:20px;text-align:center;box-shadow:0 0 40px rgba(255,90,90,.25)}

.logo{width:100%;max-width:360px;margin:0 auto 16px;display:block}

h1{font-size:18px;margin-bottom:10px}
.tagline{font-size:11px;line-height:1.6;opacity:.85;margin-bottom:14px}

input[type=email]{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#0b0c13;color:#fff;font-family:inherit;font-size:11px}
input:focus-visible{outline:2px solid #ff5a5a;outline-offset:2px}

button{margin-top:12px;padding:10px;border-radius:8px;border:none;background:#ff5a5a;color:#111;font-family:inherit;font-size:11px;cursor:pointer}
button:hover{background:#ff7070}

.fine{font-size:9px;opacity:.55;margin-top:10px;line-height:1.5}

.msg{display:none;font-size:10px;margin-top:8px}

:root{ --cursor: url('assets/indexgrim.png') 12 12, auto; }
:where(html, body, *):not(input, textarea){ cursor: var(--cursor) !important; }
input, textarea{ cursor:text !important; }
</style>
</head>
<body>
<div id="grid" aria-hidden="true"></div>

<div class="container">
  <img src="assets/SinsF.png" alt="Sins of the Past" class="logo">
  <h1>Become a Sinner</h1>
  <p class="tagline">
    This is not a newsletter.<br>
    It’s an invitation.<br><br>
    Early drops. Private access. Unreleased pieces.
  </p>

  <form action="https://formspree.io/f/abcdwxyz" method="POST">
    <input id="email" type="email" placeholder="Enter your email" required>
    <button type="submit">Join the Sins</button>
  </form>

  <div id="msg" class="msg"></div>

  <p class="fine">
    By joining, you accept that Sins of the Past is not for everyone.
  </p>
</div>

<script>
const form=document.getElementById('sinnerForm');
const msg=document.getElementById('msg');

form.addEventListener('submit',e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.textContent="That email feels false. Try again.";
    msg.style.display='block';
    return;
  }

  // Save locally for now (replace with Mailchimp / Klaviyo later)
  localStorage.setItem('stp_sinner_email',email);

  msg.textContent="You’re marked. Entering…";
  msg.style.display='block';

  setTimeout(()=>{
    window.location.replace('./home.html');
  },1200);
});
</script>
</body>
</html>
