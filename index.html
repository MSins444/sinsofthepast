<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sins of the Past — The Gate</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html, body {
  margin:0; height:100%;
  font-family:'Press Start 2P', monospace;
  display:flex; align-items:center; justify-content:center;
  background:#000; color:#fff;
}

.card {
  width:min(460px,92vw);
  background:#0b0c13;
  border:2px solid #00e0c6;
  border-radius:12px;
  padding:16px;
  text-align:center;
}

img.logo {
  max-width:280px;
  margin-bottom:16px;
}

label { font-size:11px; display:block; margin-top:12px; }
input {
  width:100%; margin-top:6px; padding:8px;
  background:#000; border:1px solid #333; color:#fff;
}

.btns { display:flex; gap:8px; margin-top:12px; }
button {
  flex:1; padding:10px;
  font-family:inherit; border-radius:8px;
  background:#111; color:#fff; border:1px solid #333;
  cursor:pointer;
}
button.primary { background:#ff5a5a; color:#000; font-weight:bold; }

.msg { font-size:10px; margin-top:8px; opacity:.7; }
.hidden { display:none; }
</style>
</head>
<body>

<div class="card" id="sinCard">
  <img src="SinsF.png" alt="Sins of the Past" class="logo">
  <p>Before you enter… confess your <b>last sin</b>.</p>
  <label>Type it:</label>
  <input id="sinInput" placeholder="pride, greed, lust…" autocomplete="off">
  <div class="btns">
    <button class="primary" id="saveSin">Confess</button>
    <button id="skipSin">Skip</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card hidden" id="reaperGame">
  <p>You refused confession.</p>
  <p>Beat the <b>Grim Reaper</b> (Best of 3).</p>
  <div class="btns">
    <button data-move="rock">🪨</button>
    <button data-move="paper">📜</button>
    <button data-move="scythe">⚔️</button>
  </div>
  <div class="msg" id="gameMsg"></div>
</div>

<script>
const KEY = 'sop_user';
const sinInput = document.getElementById('sinInput');
const msg = document.getElementById('msg');
const sinCard = document.getElementById('sinCard');
const reaperGame = document.getElementById('reaperGame');
const gameMsg = document.getElementById('gameMsg');

let user = {
  lastSin: '',
  beatGrimReaper: false,
  discountCode: '',
  firstVisit: true
};

function saveUser(){ localStorage.setItem(KEY, JSON.stringify(user)); }

// CONFESS
document.getElementById('saveSin').onclick = () => {
  const val = sinInput.value.trim();
  if(!val){
    msg.textContent = 'Say something… or face judgment.';
    return;
  }
  user.lastSin = val;
  saveUser();
  enterHome();
};

// SKIP → REAPER GAME
document.getElementById('skipSin').onclick = () => {
  user.lastSin = 'skipped';
  saveUser();
  sinCard.classList.add('hidden');
  reaperGame.classList.remove('hidden');
};

// MINI-GAME LOGIC (Best 2 of 3)
let playerWins = 0;
let reaperWins = 0;
const beats = { rock: 'scythe', scythe: 'paper', paper: 'rock' };

document.querySelectorAll('[data-move]').forEach(btn=>{
  btn.onclick = () => {
    const player = btn.dataset.move;
    const reaper = ['rock','paper','scythe'][Math.floor(Math.random()*3)];

    if(player === reaper){
      gameMsg.textContent = 'A draw… fate hesitates.';
      return;
    }

    if(beats[player] === reaper){
      playerWins++;
      gameMsg.textContent = 'You win this round.';
    } else {
      reaperWins++;
      gameMsg.textContent = 'The Reaper claims a round.';
    }

    if(playerWins === 2 || reaperWins === 2){
      if(playerWins === 2){
        user.beatGrimReaper = true;
        user.discountCode = 'REAPER15';
      }
      saveUser();
      setTimeout(enterHome, 1000);
    }
  };
});

function enterHome(){ window.location.href = 'home.html'; }
</script>

</body>
</html>
